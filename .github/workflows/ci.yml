name: CI

# Every push and pull request: TypeScript tests, typecheck and lint, then the Kotlin
# module's unit tests (queue rules, audio math). APKs are built by android-release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Tests, typecheck, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx vitest run

  kotlin:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      # android/ is generated here and never committed.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Unit tests
        working-directory: android
        run: ./gradlew :kanta-media:testDebugUnitTest
